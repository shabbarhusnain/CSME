{% extends 'base.html'%}
{% block start %}
<div class="container col-6">
    <form class="container" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <h1>Update Password</h1>
        <hr>
        {% if messages %}
        {%for message in messages %}
        <div class="alert alert-primary">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <div class="mt-3">
        <label class="form-lable">New Password</label>
        <input name="password1" type="password" required class="form-control" placeholder="Enter your password here">
        </div>
        <div class="mt-3">
        <label class="form-lable">Confirm Password</label>
        <input name="password2" type="password" required class="form-control" placeholder="Enter your password here.">
        </div>
        <div class="mt-3">

            <button type="submit" class="btn btn-success">Login</button>
        </div>
    </form>
</div>
{% endblock %}
